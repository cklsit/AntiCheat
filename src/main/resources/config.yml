# 通知节流：同类反作弊提示对同一玩家的最小重复发送间隔（毫秒）
# 用于防止聊天栏刷屏；不影响实际处罚动作（封禁/验证码/监控仍会立即执行）
notify:
  throttleMs: 2000

detection:
  # 各检测项通用字段：
  #   enabled                是否启用该检测
  #   maxViolations          触发封禁前允许的最大违规数
  #   banTime                封禁时长（"30m"/"1h"/"6h"/"1d"/"7d"/"permanent"）
  #   kickThreshold          达到该违规数时踢出玩家
  #   humanReviewThreshold   达到该违规数时升级人工审核
  #   warningCooldownSecs    警告消息冷却（秒），避免同类刷屏
  #   notifyCooldownMs       检测通知冷却（毫秒），控制 DecisionActionCenter 提示频率
  fly:
    enabled: true
    maxViolations: 5
    banTime: "1h"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  speed:
    enabled: true
    maxViolations: 5
    banTime: "30m"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  esp:
    enabled: true
    maxViolations: 3
    banTime: "6h"
    kickThreshold: 15
    humanReviewThreshold: 10
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  killaura:
    enabled: true
    maxViolations: 5
    banTime: "1d"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000
  reach:
    enabled: true
    maxViolations: 5
    banTime: "2h"
    kickThreshold: 20
    humanReviewThreshold: 15
    warningCooldownSecs: 2
    notifyCooldownMs: 5000

ban:
  minTime: "1m"
  maxTime: "1d"

database:
  type: "sqlite"
  server-name: "Server-1"
  sqlite:
    path: "anticheat.db"
  h2:
    path: "anticheat"
  mysql:
    host: "localhost"
    port: 3306
    database: "anticheat"
    username: "root"
    password: ""
  redis:
    host: "localhost"
    port: 6379
    password: ""
  mongodb:
    host: "localhost"
    port: 27017
    database: "anticheat"

check-client:
  timeout-minutes: 60

bounty:
  enabled: true
  default-time-limit-minutes: 30

# Web 管理面板配置
# 插件启动时自动启动内嵌 HTTP+WS 服务器，访问 http://<server-ip>:<port>/ 即打开面板
# 演示账号：明文密码 = 用户名（admin/admin、moderator/moderator、reviewer/reviewer、observer/observer）
# 生产部署务必修改：游戏内执行 /ac genpwd <新密码> 生成 bcrypt 哈希并替换下方对应 password-hash，
# 然后执行 /ac reload 生效（修改 config.yml 后也必须 /ac reload，账号不会热加载）
web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  session-timeout-minutes: 120
  cors:
    enabled: false
  auth:
    accounts:
      - username: "admin"
        # bcrypt 哈希，明文为 "admin"（已实测可通过 PasswordHasher.verify）
        password-hash: "$2a$10$gN3iGwd7y3Vyy6sQbiu0Q.Sgq.uLwJyICeohTDuneSt79oJN5daVC"
        role: "admin"
        permissions:
          - "*"
      - username: "moderator"
        # 明文为 "moderator"
        password-hash: "$2a$10$A9sOxVM7oa4IkXXAE67WI.yHa5PM4xoEkkmPk/gQWOCgavjeEn2HO"
        role: "mod"
        permissions:
          - "players:*"
          - "cases:*"
          - "dashboard:*"
          - "audit:read"
          - "notifications:*"
      - username: "reviewer"
        # 明文为 "reviewer"
        password-hash: "$2a$10$nL0nD.5xmScuTi2nK4Nl8e3PyC6iAHEQ7R4Tu29EMGKrRW6Gee5xO"
        role: "reviewer"
        permissions:
          - "cases:read"
          - "cases:verdict"
          - "dashboard:read"
          - "audit:read"
          - "notifications:read"
      - username: "observer"
        # 明文为 "observer"
        password-hash: "$2a$10$W0wK7xTZ.SpO2ZYIuONEvu93O0L6MMyvMTWi8DVYKUUzJnPiQuJ9."
        role: "observer"
        permissions:
          - "dashboard:read"
          - "players:read"
          - "notifications:read"
