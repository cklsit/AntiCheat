detection:
  fly:
    enabled: true
    maxViolations: 5
    banTime: "1h"
  speed:
    enabled: true
    maxViolations: 5
    banTime: "30m"
  esp:
    enabled: true
    maxViolations: 3
    banTime: "6h"
  killaura:
    enabled: true
    maxViolations: 5
    banTime: "1d"
  reach:
    enabled: true
    maxViolations: 5
    banTime: "2h"

ban:
  minTime: "1m"
  maxTime: "1d"

database:
  type: "sqlite"
  server-name: "Server-1"
  sqlite:
    path: "anticheat.db"
  h2:
    path: "anticheat"
  mysql:
    host: "localhost"
    port: 3306
    database: "anticheat"
    username: "root"
    password: ""
  redis:
    host: "localhost"
    port: 6379
    password: ""
  mongodb:
    host: "localhost"
    port: 27017
    database: "anticheat"

check-client:
  timeout-minutes: 60

bounty:
  enabled: true
  default-time-limit-minutes: 30

# Web 管理面板配置
# 插件启动时自动启动内嵌 HTTP+WS 服务器，访问 http://<server-ip>:<port>/ 即打开面板
# 默认账号 admin/admin（明文），生产部署请用 /ac genpwd <新密码> 生成 bcrypt 哈希替换
web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  session-timeout-minutes: 120
  cors:
    enabled: false
  auth:
    accounts:
      - username: "admin"
        # bcrypt 哈希，明文为 "admin"
        password-hash: "$2a$10$N9qo8uLOickgx2ZMRZoMy4IjkyYbN7UuLpJ3y3oXZ7p1C4Ra0Km8O"
        role: "admin"
        permissions:
          - "*"
      - username: "moderator"
        password-hash: "$2a$10$N9qo8uLOickgx2ZMRZoMy4IjkyYbN7UuLpJ3y3oXZ7p1C4Ra0Km8O"
        role: "mod"
        permissions:
          - "players:*"
          - "cases:*"
          - "dashboard:*"
          - "audit:read"
          - "notifications:*"
      - username: "reviewer"
        password-hash: "$2a$10$N9qo8uLOickgx2ZMRZoMy4IjkyYbN7UuLpJ3y3oXZ7p1C4Ra0Km8O"
        role: "reviewer"
        permissions:
          - "cases:read"
          - "cases:verdict"
          - "dashboard:read"
          - "audit:read"
          - "notifications:read"
      - username: "observer"
        password-hash: "$2a$10$N9qo8uLOickgx2ZMRZoMy4IjkyYbN7UuLpJ3y3oXZ7p1C4Ra0Km8O"
        role: "observer"
        permissions:
          - "dashboard:read"
          - "players:read"
          - "notifications:read"
